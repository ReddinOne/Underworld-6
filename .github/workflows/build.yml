name: Build Minecraft 26.3 mod
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Test terrain geometry without Minecraft runtime
        run: |
          mkdir -p build/terrain-test
          javac -d build/terrain-test src/main/java/dev/unstable/underworld/UnderworldMath.java scripts/TerrainMathTest.java
          java -cp build/terrain-test TerrainMathTest
      - name: Test structure distribution without Minecraft runtime
        run: |
          javac -d build/terrain-test src/main/java/dev/unstable/underworld/UnderworldMath.java src/main/java/dev/unstable/underworld/UnderworldPlacement.java scripts/PlacementTest.java
          java -cp build/terrain-test PlacementTest
      - name: Check resource definitions
        run: python3 scripts/validate_resources.py
      - name: Verify 26.3 resource item IDs
        run: python3 scripts/check_distribution.py
      - name: Build mod
        run: gradle build --stacktrace
      - name: Inspect compiled mod JAR
        run: python3 scripts/verify_artifact.py
      - name: Upload Minecraft mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: unstable-underworld-26.3
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
